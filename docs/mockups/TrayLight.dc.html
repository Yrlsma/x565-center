<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Трей · светлая тема</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 380px; height: 620px; box-sizing: border-box; padding: 20px; background: #F3F5F7; color: #14171A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div>
<div style="font-size: 16px; font-weight: 700">X565 Center</div>
<div style="margin-top: 2px; font-size: 13px; color: #56606B">От сети · 86%</div>
</div>
<button aria-label="Открыть полное окно" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #14171A; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-8 8M10 20H4v-6M4 20l8-8"></path></svg>
</button>
</header>
<div role="group" aria-label="Режим работы" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 5px; border-radius: 14px; background: #FFFFFF">
<button style="min-height: 48px; border: 0; border-radius: 10px; background: transparent; color: #56606B; font-size: 14px; font-weight: 600">Тихий</button>
<button aria-pressed="true" style="min-height: 48px; border: 0; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700">Баланс</button>
<button style="min-height: 48px; border: 0; border-radius: 10px; background: transparent; color: #56606B; font-size: 14px; font-weight: 600">Турбо</button>
</div>
<section aria-label="Показатели" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<div style="padding: 14px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #56606B">Процессор</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; line-height: 1">58°</div>
<div style="font-size: 13px; color: #56606B">34%</div>
</div>
<div style="padding: 14px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #56606B">Видеокарта</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; line-height: 1; color: #A8480A">71°</div>
<div style="font-size: 13px; color: #56606B">82%</div>
</div>
<div style="padding: 14px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #56606B">Вентиляторы</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; line-height: 1">3200</div>
<div style="font-size: 13px; color: #56606B">об/мин</div>
</div>
<div style="padding: 14px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #56606B">Память</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; line-height: 1">9.4</div>
<div style="font-size: 13px; color: #56606B">из 16 ГБ</div>
</div>
</section>
<section aria-label="Быстрые действия" style="display: flex; flex-direction: column; gap: 8px">
<button aria-pressed="true" style="min-height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border: 0; border-radius: 12px; background: #FFFFFF; color: #14171A; font-size: 14px; font-weight: 500">Экран 144 Гц<span style="font-size: 13px; font-weight: 700; color: {{accent}}">Вкл</span></button>
<button aria-pressed="false" style="min-height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border: 0; border-radius: 12px; background: #FFFFFF; color: #14171A; font-size: 14px; font-weight: 500">Только встроенная графика<span style="font-size: 13px; font-weight: 700; color: #56606B">Выкл</span></button>
<button aria-pressed="true" style="min-height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border: 0; border-radius: 12px; background: #FFFFFF; color: #14171A; font-size: 14px; font-weight: 500">Wi‑Fi<span style="font-size: 13px; font-weight: 700; color: {{accent}}">Вкл</span></button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7D72"},"$preview":{"width":380,"height":620}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0B7D72' };
}
}
</script>
</body>
</html>
