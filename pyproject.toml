[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x565-center"
version = "0.1.0"
description = "Панель управления для ноутбука Maibenben X565"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",
    "winrt-runtime>=3.0",
    "winrt-Windows.Devices.Radios>=3.0",
    "winrt-Windows.Foundation>=3.0",
    "winrt-Windows.Foundation.Collections>=3.0",
]

[project.gui-scripts]
x565-center = "x565_center.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
